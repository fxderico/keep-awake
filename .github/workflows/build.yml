name: Build Keep Awake DMG

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build and package DMG
        run: ./Scripts/build.sh

      - name: Upload wakeup.dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakeup-dmg
          path: dist/wakeup.dmg
          if-no-files-found: error
